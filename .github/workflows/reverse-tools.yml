name: Package Reverse Engineering Tools
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/reverse-tools.yml]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Apktool and jadx releases
        run: |
          mkdir -p toolkit
          set -euxo pipefail
          APKTOOL_URL=$(curl -fsSL "https://api.github.com/repos/iBotPeaches/Apktool/releases/tags/v3.0.3" | jq -r '.assets[].browser_download_url | select(endswith(".jar"))' | head -1)
          JADX_URL=$(curl -fsSL "https://api.github.com/repos/skylot/jadx/releases/tags/v1.5.6" | jq -r '.assets[].browser_download_url | select(endswith("jadx-1.5.6.zip"))' | head -1)
          test -n "$APKTOOL_URL"
          test -n "$JADX_URL"
          curl -fL --retry 4 "$APKTOOL_URL" -o toolkit/apktool.jar
          curl -fL --retry 4 "$JADX_URL" -o toolkit/jadx.zip
          ls -lh toolkit/
      - uses: actions/upload-artifact@v4
        with:
          name: android-reverse-engineering-toolkit
          path: toolkit/*
          compression-level: 0
