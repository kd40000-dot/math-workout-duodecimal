name: Build Original-App Modular Numeral Renderer
on:
  workflow_dispatch:
  push:
    paths:
      - 'reverse-patch/java/com/sankhyantra/mathstricks/duo/OriginalGlyphInstaller.java'
      - 'app/src/main/java/com/duodecimal/workout/Numerals.java'
      - 'app/src/main/java/com/duodecimal/workout/ModularDigits.java'
      - '.github/workflows/build-original-glyph-dex.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Draft A vector renderer for original app
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$ANDROID_HOME"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p build/glyph-src/com/sankhyantra/mathstricks/duo build/compiled build/artifact
          for file in Numerals.java ModularDigits.java; do
            sed 's/^package com.duodecimal.workout;/package com.sankhyantra.mathstricks.duo;/' \
              "app/src/main/java/com/duodecimal/workout/$file" \
              > "build/glyph-src/com/sankhyantra/mathstricks/duo/$file"
          done
          cp reverse-patch/java/com/sankhyantra/mathstricks/duo/OriginalGlyphInstaller.java \
             build/glyph-src/com/sankhyantra/mathstricks/duo/
          javac --release 8 -cp "$SDK/platforms/android-35/android.jar" \
            -d build/compiled build/glyph-src/com/sankhyantra/mathstricks/duo/*.java
          find build/compiled -name '*.class' -print
          find build/compiled -name '*.class' -print0 | xargs -0 \
            "$SDK/build-tools/35.0.0/d8" --min-api 25 \
            --lib "$SDK/platforms/android-35/android.jar" \
            --output build/artifact
          mv build/artifact/classes.dex build/artifact/classes6.dex
          unzip -p app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: original-mtw-modular-numerals-classes6
          path: build/artifact/classes6.dex
          if-no-files-found: error
