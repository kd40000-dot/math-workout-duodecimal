name: Build Duodecimal Workout APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35 is installed
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test arithmetic
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: duodecimal-workout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish directly downloadable APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Duodecimal-Workout-1.0.0.apk
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Duodecimal-Workout-1.0.0.apk --clobber
          else
            gh release create v1.0.0 Duodecimal-Workout-1.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "Duodecimal Workout 1.0.0" \
              --notes "First base-twelve Android workout app. Offline, Dracula-themed, 20 exercise modes. Debug-signed test build; installs alongside Math Tricks Workout."
          fi
