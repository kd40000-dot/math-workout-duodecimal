name: Build Duodecimal Workout APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35 is installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify dark dropdown contrast
        run: python3 app/ci/test_spinner_contrast.py
      - name: Test arithmetic
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Restore repository signing identity
        run: |
          path="$RUNNER_TEMP/duodecimal-signing.p12"
          base64 --decode signing/duodecimal-public.p12.b64 > "$path"
          chmod 600 "$path"
          signing_password=$(printf '%s' 'kd40000-dot/math-workout-duodecimal:permanent-public-signing:v1' | sha256sum | cut -c1-32)
          echo "::add-mask::$signing_password"
          keytool -list -keystore "$path" -alias duodecimal -storepass "$signing_password" > /dev/null
          echo "DUO_SIGNING_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"
          echo "DUO_SIGNING_PASSWORD=$signing_password" >> "$GITHUB_ENV"
      - name: Assemble release APK using permanent signing key
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and signing certificate
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected="7436e57a25bc8e753cc4756f58788b1198bcbab301188c0c44ef999f0b0f814b"
          if [ "$cert" != "$expected" ]; then
            echo "::error::Signing certificate does not match the permanent Duodecimal Workout key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: duodecimal-workout-1.6.2-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish directly downloadable signed APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Duodecimal-Workout-1.6.2-signed.apk
          if gh release view v1.6.2 >/dev/null 2>&1; then
            gh release upload v1.6.2 Duodecimal-Workout-1.6.2-signed.apk --clobber
          else
            gh release create v1.6.2 Duodecimal-Workout-1.6.2-signed.apk \
              --target "$GITHUB_SHA" \
              --title "Duodecimal Workout 1.6.2 — persistent signing" \
              --notes "Uses the permanent Duodecimal Workout signing certificate stored in this repository. Future releases update in place and preserve learning progress. APKs signed with a different older certificate require a one-time migration."
          fi
