name: Build Duodecimal Workout APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35 is installed
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify dark dropdown contrast
        run: python3 app/ci/test_spinner_contrast.py
      - name: Test arithmetic
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Restore persistent keystore from GitHub encrypted secrets
        env:
          DUO_SIGNING_KEYSTORE_B64: ${{ secrets.DUO_SIGNING_KEYSTORE_B64 }}
          DUO_SIGNING_PASSWORD: ${{ secrets.DUO_SIGNING_PASSWORD }}
        run: |
          if [ -z "$DUO_SIGNING_KEYSTORE_B64" ] || [ -z "$DUO_SIGNING_PASSWORD" ]; then
            echo "::error::Set DUO_SIGNING_KEYSTORE_B64 and DUO_SIGNING_PASSWORD under Settings > Secrets and variables > Actions before building."
            exit 1
          fi
          path="$RUNNER_TEMP/duodecimal-signing.p12"
          printf '%s' "$DUO_SIGNING_KEYSTORE_B64" | base64 --decode > "$path"
          chmod 600 "$path"
          keytool -list -keystore "$path" -alias duodecimal -storepass "$DUO_SIGNING_PASSWORD" > /dev/null
          echo "DUO_SIGNING_KEYSTORE_PATH=$path" >> "$GITHUB_ENV"
      - name: Assemble release APK using permanent signing key
        env:
          DUO_SIGNING_PASSWORD: ${{ secrets.DUO_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and signing certificate
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          expected="7436e57a25bc8e753cc4756f58788b1198bcbab301188c0c44ef999f0b0f814b"
          if [ "$cert" != "$expected" ]; then
            echo "::error::Signing certificate does not match the permanent Duodecimal Workout key."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: duodecimal-workout-1.6.1-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish directly downloadable signed APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Duodecimal-Workout-1.6.1-signed.apk
          if gh release view v1.6.1 >/dev/null 2>&1; then
            gh release upload v1.6.1 Duodecimal-Workout-1.6.1-signed.apk --clobber
          else
            gh release create v1.6.1 Duodecimal-Workout-1.6.1-signed.apk \
              --target "$GITHUB_SHA" \
              --title "Duodecimal Workout 1.6.1 — persistent signing" \
              --notes "First release signed with the permanent Duodecimal Workout certificate. Future releases will update in place without losing saved learning progress. A previous build with another signature cannot be upgraded in place."
          fi
