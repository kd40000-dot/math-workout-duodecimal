plugins { id 'com.android.application' }
android {
    namespace 'com.duodecimal.workout'
    compileSdk 35
    defaultConfig {
        applicationId 'com.duodecimal.workout'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.7.0'
    }
    signingConfigs {
        persistent {
            // Reconstructed by GitHub Actions from the repository's stable public signing bundle.
            storeFile file(System.getenv('DUO_SIGNING_KEYSTORE_PATH') ?: 'missing-keystore.jks')
            storePassword System.getenv('DUO_SIGNING_PASSWORD') ?: ''
            keyAlias 'duodecimal'
            keyPassword System.getenv('DUO_SIGNING_PASSWORD') ?: ''
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.persistent
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
